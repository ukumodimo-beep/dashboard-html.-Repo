<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>DASHBOARD72</title>

            </div>

            <header class="bg-white sticky top-0 p-4 flex md:justify-content md:items-center shadow mb-4">

                    <button class="bg-yellow-200 text-white px-2 py-1 rounded hover:bg-yellow-200">uk</button>
                </div>
            </header>
            <!-- main page content -->
            <div class="bg-gray-200 p-4">

                        <header class="bg-white shadow p-3 rounded w-full">
                            <h3 class="font-bold text-xl">WELCOMEBACK, UKUMO</h3>

                        </header>
                        <!--PROFILE-AREA  -->
                        <div class=" overflow-hidden  shadow rounded  p-2 mt-4">
                        <div class="h-2 m-1 rounded bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500"></div>
                            <div class="flex bg-gray-100 items-center rounded shadow m-4">
                                <img class="h-20 w-20 rounded-full" src="gabriele-malaspina-CjWsslYVnPI-unsplash.jpg" alt="">

                                    <h2 class="text-lg font-bold text-xs">UKUMO DIMO ADHAL</h2>
                                    <span class="text-gray-600 px-2 font-bold py-1 text-xs bg-yellow-300 rounded">#LSS-STD-0085</span>
                                    <span class="text-gray-600 px-2 font-bold py-1 text-xs bg-white rounded">S4A</span>
                                    <span class="text-gray-600 px-2 font-bold py-1 text-xs bg-green-300 rounded">Active</span>
                                </div>
                            </div>

                            <!-- Scrollable Content -->
                            <div class="h-[calc(90vh-4rem)] overflow-y-auto p-2">
                                <div class="mt-6 space-y-4">
                                    <div class="h-40 rounded-lg bg-gray-200"></div>
                                    <div class="h-40 rounded-lg bg-gray-200"></div>
                                    <div class="h-40 rounded-lg bg-gray-200"></div>
                                    <div class="h-40 rounded-lg bg-gray-200"></div>
                                    <div class="h-40 rounded-lg bg-gray-200"></div>
                                    <div class="h-40 rounded-lg bg-gray-200"></div>
                                </div>
